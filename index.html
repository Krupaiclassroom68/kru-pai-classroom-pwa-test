<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kru Pai Digital Classroom V2.4H — Student Access</title>
<meta name="theme-color" content="#163d62">
<meta name="application-name" content="Kru Pai Classroom">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kru Pai Classroom">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{
  --ink:#17324d;--muted:#6f8294;--paper:#fffef9;--mint:#4ed9bd;--sky:#6bbcff;
  --sun:#ffd56a;--pink:#ff91b8;--purple:#9a8cff;--line:#d9e8ef;--navy:#12385b;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:var(--ink)}
body{
  min-height:100vh;
  background:
    radial-gradient(circle at 8% 7%,rgba(255,213,106,.45),transparent 18%),
    radial-gradient(circle at 92% 8%,rgba(107,188,255,.35),transparent 22%),
    linear-gradient(180deg,#eaf8ff 0 42%,#f7efd8 42% 100%);
  overflow-x:hidden;
}
button,input{font:inherit}
.sky-deco{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:-1}
.cloud{position:absolute;width:120px;height:36px;background:rgba(255,255,255,.7);border-radius:999px;filter:blur(.2px)}
.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud:before{width:48px;height:48px;left:20px;bottom:4px}.cloud:after{width:62px;height:62px;right:18px;bottom:2px}
.c1{top:9%;left:-20px;animation:float 10s ease-in-out infinite}.c2{top:15%;right:-15px;transform:scale(.75);animation:float 13s ease-in-out infinite reverse}
@keyframes float{50%{transform:translateY(10px) translateX(12px)}}
.wrap{max-width:1120px;margin:auto;padding:18px 16px 34px}
.school-sign{
  max-width:860px;margin:8px auto 18px;text-align:center;padding:16px 22px;
  border:4px solid #fff;border-radius:24px;background:linear-gradient(135deg,#163d62,#215d82);
  color:#fff;box-shadow:0 12px 0 rgba(25,67,95,.12),0 20px 50px rgba(31,84,117,.16);
  position:relative
}
.school-sign:before,.school-sign:after{content:"";position:absolute;top:-28px;width:8px;height:30px;background:#9b704d;border-radius:8px}
.school-sign:before{left:24%}.school-sign:after{right:24%}
.kicker{font-size:11px;letter-spacing:.17em;font-weight:950;color:#bdf8e9}
.school-sign h1{font-size:clamp(31px,6vw,58px);line-height:1;margin:7px 0 5px;letter-spacing:-.04em}
.school-sign h1 span{color:var(--sun)}
.school-sign p{margin:0;color:#d9efff;font-size:14px}
.card{
  background:rgba(255,254,249,.95);border:2px solid rgba(255,255,255,.95);border-radius:28px;
  box-shadow:0 22px 55px rgba(48,84,105,.14);padding:20px;backdrop-filter:blur(8px)
}
.login{max-width:590px;margin:26px auto;text-align:center;padding:32px 25px;position:relative}
.login-icon{width:92px;height:92px;margin:-6px auto 8px;display:grid;place-items:center;font-size:48px;border-radius:28px;background:linear-gradient(145deg,#e7fff7,#e8f5ff);border:1px solid var(--line)}
.login h2{font-size:30px;margin:8px 0}.muted{color:var(--muted)}
.field{width:100%;padding:15px;border-radius:17px;border:2px solid #cfe2eb;background:#f7fcff;color:var(--ink);outline:none;text-align:center;font-size:27px;font-weight:950;text-transform:uppercase;letter-spacing:.08em}
.field:focus{border-color:var(--mint);box-shadow:0 0 0 5px rgba(78,217,189,.12)}
.btn{border:1px solid #cfe1e9;border-radius:14px;padding:11px 15px;background:#f7fbfd;color:var(--ink);font-weight:900;cursor:pointer;transition:.16s transform,.16s box-shadow}
.btn:hover{transform:translateY(-1px);box-shadow:0 7px 18px rgba(44,88,115,.11)}
.btn.primary{background:linear-gradient(135deg,#43c9ae,#4b9fe5);border-color:transparent;color:#fff}
.btn.sun{background:linear-gradient(135deg,#ffd76c,#ffb95f);border-color:transparent;color:#67410d}
.btn.big{width:100%;font-size:18px;padding:14px;margin-top:10px}
.notice{margin:14px 0;padding:11px 13px;border:1px solid #f0dfaa;border-radius:14px;background:#fff9df;color:#7b6427;font-size:12px}
.error{margin-top:12px;padding:11px;border-radius:13px;border:1px solid #ffc0cc;background:#fff0f3;color:#a63e55;display:none}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.student-chip,.room-chip{display:inline-flex;gap:7px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:999px;background:#f7fcff;font-size:12px}
.room-board{
  position:relative;overflow:hidden;padding:22px;border-radius:23px;color:#fff;
  background:linear-gradient(135deg,#1f6c64,#2f8174 55%,#286e76);border:8px solid #bd8b58;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.13)
}
.room-board:after{content:"✦  ABC   1 2 3   ⚗   E = mc²   ✎";position:absolute;right:20px;bottom:12px;color:rgba(255,255,255,.15);font-size:20px;font-weight:900;letter-spacing:.12em}
.room-board small{font-weight:950;letter-spacing:.15em;color:#c8fff3}
.room-board h2{font-size:clamp(27px,5vw,44px);margin:5px 0;position:relative;z-index:1}
.room-board .meta{color:#e2fff8;position:relative;z-index:1}
.desk-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 2px 8px}
.desk-title h3{margin:0;font-size:21px}
.missions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.mission{
  display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:12px;align-items:center;padding:15px;
  border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,#fff,#f4fbff);
  box-shadow:0 8px 20px rgba(45,91,118,.07);position:relative;overflow:hidden
}
.mission:after{content:"";position:absolute;width:60px;height:60px;border-radius:50%;right:-25px;top:-25px;background:rgba(107,188,255,.09)}
.num{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(145deg,#fff1a9,#ffd76b);color:#735115;font-size:21px;font-weight:950;box-shadow:0 5px 0 #e6b84c}
.mission h3{margin:0;font-size:17px;line-height:1.25}.mission p{margin:5px 0 0;color:var(--muted);font-size:11px}
.subject-tag{display:inline-block;margin-top:6px;padding:4px 7px;border-radius:999px;background:#e8f8ff;color:#337399;font-size:10px;font-weight:900}
.choice{padding:15px;border:1px solid var(--line);border-radius:17px;background:#fff;margin-top:10px;cursor:pointer;text-align:left;width:100%;color:var(--ink)}
.choice:hover{border-color:var(--mint);background:#f3fffb}
.loading{text-align:center;padding:50px;color:var(--muted)}
.footer{text-align:center;color:#7f94a4;font-size:11px;padding:21px}
.welcome-overlay{position:fixed;inset:0;background:linear-gradient(145deg,#143b5d,#206b75);display:none;place-items:center;z-index:200;color:#fff;text-align:center}
.welcome-overlay.show{display:grid;animation:fadeOut 1.8s ease forwards}
.welcome-door{font-size:70px;animation:pop .5s ease}.welcome-overlay h2{font-size:clamp(28px,6vw,48px);margin:8px}.welcome-overlay p{color:#c8fff3}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fadeOut{0%,72%{opacity:1}100%{opacity:0;visibility:hidden}}
/* Game Player */
.player{position:fixed;inset:0;background:#081726;z-index:500;display:none;flex-direction:column}
.player.show{display:flex}
.playerbar{min-height:58px;padding:8px 12px;display:flex;align-items:center;gap:9px;background:linear-gradient(90deg,#123b5c,#155d66);color:#fff;border-bottom:1px solid rgba(255,255,255,.13)}
.playerbar .game-name{font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.playerbar .room-mini{font-size:11px;color:#c8fff3}
.playerbar .back{background:#fff;color:#16415c;border:0}
.playerbar .external{background:rgba(255,255,255,.11);color:#fff;border-color:rgba(255,255,255,.25)}
.gameframe{width:100%;flex:1;border:0;background:#fff}
.playerhelp{font-size:10px;color:#cbe1ee;white-space:nowrap}
@media(max-width:820px){.missions{grid-template-columns:1fr}}
@media(max-width:680px){
  .wrap{padding:10px}.school-sign{margin-top:15px;border-radius:19px;padding:14px 10px}.card{padding:13px;border-radius:21px}
  .mission{grid-template-columns:48px 1fr}.num{width:43px;height:43px}.mission .play{grid-column:1/-1;width:100%;padding:12px}
  .room-board{border-width:6px;padding:17px}.playerbar{flex-wrap:wrap}.playerhelp{display:none}.playerbar .game-name{order:3;flex-basis:100%;font-size:12px}
}

/* ===== V2.1 POLISHED CLASSROOM ===== */
.classroom-identity{
  display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  margin-bottom:12px;padding:10px 12px;border-radius:16px;background:#fff9e7;border:1px solid #f1dda6
}
.classroom-name-big{display:flex;align-items:center;gap:10px;font-weight:950;color:#684d1d}
.classroom-name-big .room-icon{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(145deg,#fff2b0,#ffd76a);box-shadow:0 4px 0 #e8bb4f
}
.classroom-code-pill{
  padding:7px 10px;border-radius:999px;background:#eef8ff;border:1px solid #cce6f3;
  color:#39779c;font-size:11px;font-weight:950;letter-spacing:.08em
}
.room-board[data-subject="English"]{background:linear-gradient(135deg,#3569a8,#527dbe 55%,#446da5)}
.room-board[data-subject="Math"]{background:linear-gradient(135deg,#5167b3,#7765bf 55%,#6b5fb0)}
.room-board[data-subject="Science"]{background:linear-gradient(135deg,#24766a,#389484 55%,#2b8176)}
.room-board[data-subject="Mixed"]{background:linear-gradient(135deg,#1f6c64,#2f8174 55%,#286e76)}
.room-board .chalk{
  position:absolute;right:20px;top:15px;font-size:28px;opacity:.12;letter-spacing:.25em;
  transform:rotate(-2deg);font-weight:900;pointer-events:none
}
.mission-icon{
  display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;margin-right:7px;
  background:#eef8ff;border:1px solid #d5e8f3;font-size:15px;vertical-align:-6px
}
.mission[data-subject="English"]{border-left:5px solid #6aa9ff}
.mission[data-subject="Math"]{border-left:5px solid #9f8cff}
.mission[data-subject="Science"]{border-left:5px solid #53d4b4}
.mission[data-subject="Mixed"]{border-left:5px solid #ffd56a}
.return-tip{
  display:flex;align-items:center;gap:8px;margin-top:14px;padding:11px 13px;border-radius:15px;
  background:#eefaf6;border:1px solid #c9eadf;color:#417263;font-size:12px
}
.return-tip b{color:#245d4f}
.playerbar .back{
  font-size:15px;padding:11px 16px;border-radius:14px;box-shadow:0 5px 0 rgba(0,0,0,.12);
  background:linear-gradient(135deg,#fff7cf,#ffe083)!important;color:#5d4613!important
}
.playerbar .back:hover{transform:translateY(-1px)}
.corner-school{
  position:absolute;left:18px;bottom:15px;font-size:26px;opacity:.12;pointer-events:none
}
@media(max-width:680px){
  .classroom-identity{align-items:flex-start}
  .classroom-code-pill{width:100%;text-align:center}
  .room-board .chalk{font-size:20px;right:10px}
}


#onlineStatus[data-state="ok"]{background:#eefaf6;border-color:#c8eadf;color:#33705f}
#onlineStatus[data-state="loading"]{background:#eef8ff;border-color:#cfe5f2;color:#47778f}
#onlineStatus[data-state="error"]{background:#fff7df;border-color:#f0dda4;color:#82682d}

</style>
</head>
<body>
<div class="sky-deco"><div class="cloud c1"></div><div class="cloud c2"></div></div>
<div class="wrap" id="siteWrap">
  <header class="school-sign">
    <div class="kicker">✨ LEARN • PLAY • GROW</div>
    <h1>Kru Pai <span>Classroom</span></h1>
    <p>ห้องเรียนดิจิทัล • เรียนรู้ผ่านภารกิจและเกม 🎮📚</p>
  </header>
  <main id="app"></main>
  <div class="footer">Kru Pai Digital Classroom • Student Web V2.4H • Student History Bridge</div>
</div>

<div id="welcome" class="welcome-overlay">
  <div><div class="welcome-door">🚪✨</div><h2 id="welcomeName">ยินดีต้อนรับ</h2><p>กำลังเปิดห้องเรียนของคุณ...</p></div>
</div>

<div id="player" class="player">
  <div class="playerbar">
    <button class="btn back" onclick="closeGamePlayer()">🏫 กลับห้องเรียน</button>
    <div class="game-name"><div id="playerGameName">Game</div><div id="playerRoomName" class="room-mini"></div></div>
    <span class="playerhelp">ถ้าเกมมีปัญหา กดกลับห้องเรียนได้ตลอด</span>
    <button class="btn external" onclick="openCurrentGameExternal()">↗ เปิดแท็บใหม่</button>
  </div>
  <iframe id="gameFrame" class="gameframe" allow="autoplay; fullscreen" referrerpolicy="no-referrer"></iframe>
</div>

<script>
let DATA=null,session={student:null,classroom:null},currentGame=null;
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

const ONLINE_FUNCTION_URL='https://rwlteqfhppflyfobactj.supabase.co/functions/v1/kru-pai-backend';
let onlineReady=false,onlineLoading=false,onlineError='';

async function loadData(){
  if(onlineLoading)return;
  onlineLoading=true;
  onlineError='';
  updateLoginStatus('กำลังเชื่อมต่อห้องเรียน Online...','loading');
  try{
    const res=await fetch(ONLINE_FUNCTION_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'get'}),
      cache:'no-store'
    });
    const j=await res.json().catch(()=>null);
    if(!res.ok)throw new Error((j&&j.error)||('HTTP '+res.status));
    const payload=j?.payload||null;
    if(!payload||payload.format!=='KruPaiStudentClassroomData'){
      throw new Error('ยังไม่พบข้อมูล Kru Pai Classroom Online');
    }
    DATA=payload;
    onlineReady=true;
    onlineLoading=false;
    updateLoginStatus(`🟢 ห้องเรียนพร้อม • ${DATA.classrooms?.length||0} Classroom`,'ok');
  }catch(e){
    onlineReady=false;
    onlineLoading=false;
    onlineError=e?.message||String(e);
    updateLoginStatus('🟡 เชื่อมต่อ Online ไม่สำเร็จ • กด “ลองเชื่อมต่อใหม่”','error');
    const retry=$('retryBtn');if(retry)retry.style.display='inline-block';
  }
}
function updateLoginStatus(text,state){
  const el=$('onlineStatus');
  if(!el)return;
  el.textContent=text;
  el.dataset.state=state||'';
}
function renderLogin(){
  session={student:null,classroom:null};
  $('app').innerHTML=`<div class="card login">
    <div class="login-icon">🎒</div><h2>เข้า Classroom ของฉัน</h2>
    <p class="muted">กรอกรหัสนักเรียน และ Daily Code ที่คุณครูให้วันนี้ 🔐</p>
    <input id="code" class="field" placeholder="รหัสนักเรียน เช่น KP005" maxlength="16" autocomplete="off">
    <input id="dailyCode" class="field" style="margin-top:10px;text-align:center;font-size:26px;font-weight:900;letter-spacing:.14em" placeholder="Daily Code" maxlength="8" autocomplete="off">
    <button id="loginBtn" class="btn primary big" onclick="login()">🔓 ตรวจรหัสและเข้าเรียน</button>
    <div id="onlineStatus" class="notice" data-state="loading">กำลังเชื่อมต่อห้องเรียน Online...</div>
    <button id="retryBtn" class="btn" style="display:none;margin-top:8px" onclick="loadData()">🔄 ลองเชื่อมต่อใหม่</button>
    <div id="err" class="error"></div>
    <div class="notice">🔑 Daily Code ใช้สำหรับสิทธิ์เข้าเรียนของวันนี้เท่านั้น</div>
  </div>`;
  $('code').addEventListener('keydown',e=>{if(e.key==='Enter')$('dailyCode')?.focus()});
  $('dailyCode').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
  setTimeout(()=>$('code')?.focus(),100);
  if(onlineReady) updateLoginStatus(`🟢 ห้องเรียนพร้อม • ${DATA?.classrooms?.length||0} Classroom`,'ok');
  else loadData();
}
function localAccessDate(){
  const d=new Date();
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
async function checkAccess(studentCode,classroomCode,dailyCode){
  const res=await fetch(ONLINE_FUNCTION_URL,{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:'check-access',studentCode,classroomCode,dailyCode,accessDate:localAccessDate()}),cache:'no-store'
  });
  const j=await res.json().catch(()=>null);
  if(!res.ok)throw new Error((j&&j.error)||('HTTP '+res.status));
  if(!j||j.ok!==true)throw new Error((j&&j.error)||'ตรวจสิทธิ์ไม่สำเร็จ');
  return j.hasAccess===true;
}
async function login(){
  const code=$('code').value.trim().toUpperCase();
  const dailyCode=$('dailyCode').value.trim().toUpperCase();
  if(!code)return showErr('กรุณากรอกรหัสนักเรียนก่อน');
  if(!dailyCode)return showErr('กรุณากรอก Daily Code ที่คุณครูให้วันนี้ 🔑');
  if(!onlineReady||!DATA){showErr(onlineLoading?'กำลังเชื่อมต่อห้องเรียน Online กรุณารอสักครู่':'ยังเชื่อมต่อห้องเรียนไม่ได้ กรุณากด “ลองเชื่อมต่อใหม่”');if(!onlineLoading)loadData();return;}
  const st=(DATA.students||[]).find(x=>String(x.code).toUpperCase()===code);
  if(!st)return showErr('ไม่พบรหัสนักเรียนนี้ใน Classroom ที่เปิดเรียนอยู่');
  const memberRooms=(DATA.classrooms||[]).filter(c=>(c.memberCodes||[]).includes(st.code));
  if(!memberRooms.length)return showErr('รหัสนักเรียนนี้ยังไม่ได้เป็นสมาชิก Classroom');
  const btn=$('loginBtn'),oldText=btn?.textContent;if(btn){btn.disabled=true;btn.textContent='🔐 กำลังตรวจ Daily Code...';}
  const err=$('err');if(err)err.style.display='none';
  try{
    const checks=await Promise.all(memberRooms.map(async room=>({room,allowed:await checkAccess(st.code,room.code,dailyCode)})));
    const rooms=checks.filter(x=>x.allowed).map(x=>x.room);
    if(!rooms.length){showErr('❌ Daily Code ไม่ถูกต้อง หรือคุณครูยังไม่ได้เปิดสิทธิ์สำหรับวันนี้ 🔑');return;}
    session.student=st;showWelcome(st.name);
    setTimeout(()=>{if(rooms.length===1){session.classroom=rooms[0];renderClassroom()}else renderRoomChoice(rooms)},900);
  }catch(e){showErr('ตรวจสิทธิ์เข้าเรียนไม่สำเร็จ: '+(e?.message||String(e)));}
  finally{if(btn){btn.disabled=false;btn.textContent=oldText||'🔓 ตรวจรหัสและเข้าเรียน';}}
}
function showWelcome(name){$('welcomeName').textContent='ยินดีต้อนรับ '+name+' ✨';$('welcome').classList.remove('show');void $('welcome').offsetWidth;$('welcome').classList.add('show')}
function showErr(t){const e=$('err');e.textContent=t;e.style.display='block'}
function renderRoomChoice(rooms){
  $('app').innerHTML=`<div class="card"><div class="topbar"><div class="student-chip">👋 <b>${esc(session.student.name)}</b> • ${esc(session.student.code)}</div><button class="btn" onclick="renderLogin()">ออก</button></div>
  <div class="room-board"><small>MY CLASSROOMS</small><h2>เลือกห้องเรียน 🏫</h2><div class="meta">วันนี้อยากเข้าเรียนห้องไหน?</div></div>
  ${rooms.map((c,i)=>`<button class="choice" onclick="chooseRoom(${i})"><b>🏫 ${esc(c.name)}</b><div class="muted">${esc(c.currentLesson?.title||'')}</div></button>`).join('')}</div>`;
  window._rooms=rooms;
}
function chooseRoom(i){session.classroom=window._rooms[i];renderClassroom()}

function subjectIcon(subject){
  const x=String(subject||'').toLowerCase();
  if(x.includes('eng'))return '🔤';
  if(x.includes('math'))return '➗';
  if(x.includes('sci'))return '🧪';
  return '🎮';
}
function subjectTheme(games){
  const subjects=[...new Set((games||[]).map(g=>String(g.subject||'').toLowerCase()).filter(Boolean))];
  if(subjects.length!==1)return 'Mixed';
  const x=subjects[0];
  if(x.includes('eng'))return 'English';
  if(x.includes('math'))return 'Math';
  if(x.includes('sci'))return 'Science';
  return 'Mixed';
}

function renderClassroom(){
  const c=session.classroom,l=c.currentLesson||{},games=l.games||[],theme=subjectTheme(games);
  $('app').innerHTML=`<div class="card">
    <div class="topbar">
      <div class="student-chip">👤 <b>${esc(session.student.name)}</b> • ${esc(session.student.code)}</div>
      <button class="btn" onclick="renderLogin()">🚪 ออกจากห้อง</button>
    </div>

    <div class="classroom-identity">
      <div class="classroom-name-big"><span class="room-icon">🏫</span><span>${esc(c.name||'Kru Pai Classroom')}</span></div>
      <div class="classroom-code-pill">🔓 ผ่านสิทธิ์วันนี้ • ${esc(c.code||'CLASSROOM')}</div>
    </div>

    <section class="room-board" data-subject="${theme}">
      <div class="chalk">ABC  123  ✦  ⚗  ✎</div>
      <div class="corner-school">📚✏️</div>
      <small>WELCOME TO YOUR CLASSROOM</small>
      <h2>${esc(l.title||'บทเรียนวันนี้')}</h2>
      <div class="meta">📅 ${esc(l.date||'วันนี้')} &nbsp;•&nbsp; 🎮 ${games.length} Mission พร้อมแล้ว</div>
    </section>

    <div class="desk-title">
      <h3>📚 Mission Desk</h3>
      <span class="muted">เลือกภารกิจที่อยากเล่นได้เลย</span>
    </div>

    <div class="missions">
      ${games.map((g,i)=>`<article class="mission" data-subject="${subjectTheme([g])}">
        <div class="num">${String(i+1).padStart(2,'0')}</div>
        <div>
          <h3><span class="mission-icon">${subjectIcon(g.subject)}</span>${esc(g.name)}</h3>
          <p>${esc(g.room||'Kru Pai Game')}</p>
          <span class="subject-tag">${esc(g.subject||'GAME')}</span>
        </div>
        <button class="btn primary play" onclick="playGame(${i})">▶ เข้าเล่น</button>
      </article>`).join('')||'<div class="notice">ยังไม่มี Mission ในบทเรียนนี้</div>'}
    </div>

    <div class="return-tip">🏫 <span>เวลาเข้าเกมแล้ว ถ้ามีปัญหาหรืออยากกลับออกมา กด <b>กลับห้องเรียน</b> ที่แถบด้านบนได้ทันที</span></div>
  </div>`;
}
// Kru Pai Student Bridge V1
// ส่งเฉพาะ Student Code + ชื่อจาก session ที่ผ่าน check-access แล้วไปยังเกม
// ไม่บันทึกคะแนนและไม่เปลี่ยนการทำงานของ Supabase
function buildStudentGameUrl(rawUrl){
  if(!rawUrl)return '';
  try{
    const u=new URL(rawUrl,window.location.href);
    const code=String(session.student?.code||'').trim();
    const name=String(session.student?.name||'').trim();
    if(code)u.searchParams.set('student',code);
    if(name)u.searchParams.set('name',name);
    return u.href;
  }catch(e){
    const sep=String(rawUrl).includes('?')?'&':'?';
    const code=encodeURIComponent(String(session.student?.code||'').trim());
    const name=encodeURIComponent(String(session.student?.name||'').trim());
    return rawUrl+sep+'student='+code+'&name='+name;
  }
}
function playGame(i){
  const g=session.classroom?.currentLesson?.games?.[i];
  if(!g?.url)return alert('เกมนี้ยังไม่มีลิงก์เล่น');
  currentGame=g;
  $('playerGameName').textContent=g.name||'Kru Pai Game';
  $('playerRoomName').textContent='🏫 '+(session.classroom?.name||'Kru Pai Classroom');
  $('gameFrame').src=buildStudentGameUrl(g.url);
  $('player').classList.add('show');
  document.body.style.overflow='hidden';
}
function closeGamePlayer(){
  $('player').classList.remove('show');
  $('gameFrame').src='about:blank';
  document.body.style.overflow='';
  currentGame=null;
}
function openCurrentGameExternal(){
  if(currentGame?.url)window.open(buildStudentGameUrl(currentGame.url),'_blank','noopener');
}
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('player').classList.contains('show'))closeGamePlayer()});
renderLogin();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(console.warn));
}
</script>
